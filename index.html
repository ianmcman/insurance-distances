<title>Hospital Distance</title>
<meta name="theme-color" content="#1f6feb">

<style>
  :root { --bg: #f5f6f8; --fg: #1c1f23; --muted: #5b6470; --card: #fff; --line: #c9ced6; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #14171a; --fg: #e6e8eb; --muted: #9aa3ad; --card: #1f2429; --line: #3a424a; color-scheme: dark; }
  body { font: 18px/1.4 -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
  main { max-width: 480px; margin: 0 auto; padding: 24px 20px; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 24px; }
  h1 { font-size: 22px; margin: 0; }
  #theme { font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  select { width: 100%; font-size: 18px; padding: 14px 12px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
  #result { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; text-align: center; }
  #miles { font-size: 48px; font-weight: 600; }
  #note, #up { font-size: 14px; color: var(--muted); }
  #up { margin-top: 28px; }
</style>
<main>
  <header><h1>Hospital Distance</h1><button id="theme"></button></header>
  <label for="from">From</label>
  <select id="from"></select>
  <label for="to">To</label>
  <select id="to"></select>
  <div id="result"><div id="miles">--</div><div id="note"></div></div>
  <div id="up"><label for="file">Replace distance table (CSV)</label><input id="file" type="file" accept=".csv,text/csv"></div>
</main>

  const f = document.getElementById("from"), t = document.getElementById("to");
  let names = [], D = {};

  function load(csv) {
    const rows = csv.trim().split(/\r?\n/).map(r => r.split(","));
    const cols = rows[0].slice(1);
    D = {};
    names = rows.slice(1).map(r => r[0]);
    rows.slice(1).forEach(r => { D[r[0]] = {}; cols.forEach((c, i) => { D[r[0]][c] = parseFloat(r[i + 1]); }); });
    [f, t].forEach(s => { s.length = 0; s.add(new Option("Select hospital", "")); names.forEach(n => s.add(new Option(n, n))); });
    show();
  }

  function show() {
    const a = f.value, b = t.value, m = document.getElementById("miles"), n = document.getElementById("note");
    m.textContent = "--";
    if (!a || !b) { n.textContent = "Pick two hospitals"; return; }
    if (a === b) { n.textContent = "Pick two different hospitals"; return; }
    // row first, then the reverse cell (Methodist rows have no columns)
    const d = D[a]?.[b] ?? D[b]?.[a];
    if (d === undefined || isNaN(d)) { n.textContent = "No route on the sheet"; return; }
    m.textContent = d.toFixed(1) + " mi";
    n.textContent = "";
  }

  // theme: saved choice, else the phone's setting
  const root = document.documentElement, tb = document.getElementById("theme");
  function setTheme(x) { root.dataset.theme = x; tb.textContent = x === "dark" ? "Light mode" : "Dark mode"; }
  let st = null;
  try { st = localStorage.getItem("theme"); } catch {}
  setTheme(st || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  tb.onclick = () => {
    const x = root.dataset.theme === "dark" ? "light" : "dark";
    setTheme(x);
    try { localStorage.setItem("theme", x); } catch {}
  };

  f.onchange = t.onchange = show;
  document.getElementById("file").onchange = async e => {
    const csv = await e.target.files[0].text();
    try { load(csv); localStorage.setItem("csv", csv); } catch { load(DEFAULT_CSV); }
  };
  let saved = null;
  try { saved = localStorage.getItem("csv"); } catch {}
  try { load(saved || DEFAULT_CSV); } catch { load(DEFAULT_CSV); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
